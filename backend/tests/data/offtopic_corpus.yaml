# ============================================================================
# Off-topic 闸契约语料
# ----------------------------------------------------------------------------
# 本文件是系统对"什么算无关意图、什么算 marginal 真请求"的契约声明。
# 由 backend/tests/test_offtopic_corpus_mocked.py（每次 PR 跑）和
# backend/tests/test_offtopic_corpus_real_llm.py（手动 / 未来 CI）共同消费。
#
# ── 增长流程（必读）─────────────────────────────────────────────────────────
#
# 触发点 A：用户报告误判（最高频）
#   1. 拿到原文：用户报"真请求被错拒"或"无关请求过了"
#   2. 复现并定位失效信号（通常是 normalizer sentinel 没触发/误触发）
#   3. 把原文加进对应段（off_topic 或 marginal_ic），写明 source / reason
#   4. 先跑 mock 测——预期是 fail（红灯证明语料抓住了真问题）
#   5. 改 prompt / 代码使其变绿 → PR → CI 永守
#
# 触发点 B：新增 code_type 或重大模板库变更（中频）
#   PR 前 checklist：
#     □ 新 code_type 至少补 1 条 marginal_ic 边界样本（语料覆盖）
#     □ 新模板若引入了以前没法生成的场景，补一条对应输入
#
# 触发点 C：LLM 模型 / Prompt 重大改动（低频但风险高）
#   1. 本地跑 `pytest tests/test_offtopic_corpus_real_llm.py --real-llm -v`
#   2. 看分类率：off_topic 全 422、marginal_ic 全 200
#   3. 若分类率下降，先修 prompt 而不是改语料
#   4. 实在无法修就标 flaky: true 并在 reason 里写明原因——保留历史
#
# ── 字段约定 ────────────────────────────────────────────────────────────────
#   id            必填，蛇形命名，唯一
#   input         必填，用户原文
#   code_types    off_topic 用；列表，会对每个 code_type 跑一次
#   code_type     marginal_ic 用；单个字符串
#   signals       marginal_ic 可选；信号列表
#   added         必填，添加日期 "YYYY-MM-DD"
#   source        必填，来源（"initial seed" / "user report 2026-XX-XX" / "code_type 新增" 等）
#   reason        必填，6 个月后能看懂"这条为啥在这"
#   flaky         可选，true 表示真 LLM 测可能不稳定，real-llm 套件会 warn 但不 fail
#
# ── 维护准则 ────────────────────────────────────────────────────────────────
#   - append-only 优先：除非彻底改设计契约，不要删除已有样本——它们是历史回归的疫苗
#   - 测试断言保持松散：不绑具体 template_id（避免模板改名破测）
# ============================================================================

off_topic:
  - id: poem_chinese_classical
    input: "帮我写一首七言律诗咏春"
    code_types: [assertion, coverage]
    added: "2026-05-13"
    source: "initial seed (user report)"
    reason: "中文古典诗词——纯文学，零 IC 词汇，应被 sentinel 拦下"

  - id: cooking_recipe
    input: "推荐一道适合冬天的菜谱给我"
    code_types: [assertion, coverage]
