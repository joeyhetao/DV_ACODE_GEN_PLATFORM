marginal_ic:
  - id: valid_ready_stable_short
    input: "valid 信号在 ready 拉高前必须保持稳定"
    code_type: assertion
    signals:
      - {name: valid, width: 1, role: valid}
      - {name: ready, width: 1, role: ready}
    added: "2026-05-13"
    source: initial seed
    reason: "AXI 风格短表述——含明确信号 valid/ready，应当走通进确认面板"

  - id: state_reg_value_coverage
    input: "4 位状态信号 state_reg 的 0-15 全部取值覆盖率统计"
    code_type: coverage
    signals:
      - {name: state_reg, width: 4, role: state}
    added: "2026-05-13"
    source: initial seed
    reason: "覆盖率请求——明确位宽和取值范围，pipeline 应当落 cov_value_coverage_v1"

  - id: handshake_timeout_brief
    input: "握手超时检测，最多等 8 个周期"
    code_type: assertion
    signals: []
    added: "2026-05-13"
    source: initial seed
    reason: "断言意图清晰但信号列表为空——pipeline 应当 fallback 而非拒"

  - id: fsm_transition_terse
    input: "FSM 从 IDLE 跳到 ACTIVE 必须经过 PREP"
    code_type: assertion
    signals: []
    added: "2026-05-13"
    source: initial seed
    reason: "FSM 状态转换断言——口语化但含明确状态名"

  - id: data_integrity_protect
    input: "wr_en 为低时 data_reg 不能被改"
    code_type: assertion
    signals:
      - {name: wr_en, width: 1, role: enable}
      - {name: data_reg, width: 32, role: data}
    added: "2026-05-13"
    source: initial seed
    reason: "数据完整性常见场景——口语化但 IC 词汇密集"

  - id: cross_coverage_brief
    input: "axi 读写通道的 burst type 和 size 交叉覆盖"
    code_type: coverage
    signals: []
    added: "2026-05-13"
    source: initial seed
    reason: "交叉覆盖率——含协议术语 burst/AXI，应走 cov_cross_coverage_v1"

  - id: reset_behavior_short
    input: "复位释放后寄存器初值应该是 0"
    code_type: assertion
    signals: []
    added: "2026-05-13"
    source: initial seed
    reason: "复位行为断言——含明确语义但缺信号名"

  - id: transition_coverage_terse
    input: "fsm_state 的所有状态转移采样"
    code_type: coverage
    signals:
      - {name: fsm_state, width: 3, role: state}
    added: "2026-05-13"
    source: initial seed
    reason: "状态转移覆盖率——口语化但语义清晰"

  - id: max_delay_short
    input: "req 拉高到 ack 返回不超过 16 拍"
    code_type: assertion
    signals:
      - {name: req, width: 1, role: req}
      - {name: ack, width: 1, role: ack}
    added: "2026-05-13"
    source: initial seed
    reason: "最大延迟时序断言——含信号名 + 周期数"

  - id: protocol_handshake_coverage
    input: "valid/ready 握手成功率覆盖"
    code_type: coverage
    signals:
      - {name: valid, width: 1, role: valid}
      - {name: ready, width: 1, role: ready}
    added: "2026-05-13"
    source: initial seed
    reason: "协议握手覆盖率——明确属于 IC 验证范畴"
