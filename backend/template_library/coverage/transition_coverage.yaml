id: cov_transition_coverage_v1
version: "1.0.0"
name: 状态转换覆盖率组
code_type: coverage
subcategory: transition_coverage
protocol: []
tags:
  - coverage
  - transition
  - fsm
keywords:
  - 转换覆盖
  - transition
  - FSM
  - 状态机
  - 转移路径
  - 状态转移边
  - 跳转覆盖
  - 路径覆盖
  - 从A到B
  - 相邻状态
  - 状态迁移
description: |
  收集 FSM 状态之间的转移路径覆盖率（边覆盖）：验证哪些"从状态 A 跳到状态 B"的转移边被触发过。
  本模板统计的是相邻时刻之间的状态迁移，而非单一时刻的状态取值。
  典型场景：验证 IDLE→ACTIVE、ACTIVE→DONE、DONE→IDLE 等所有合法转移路径都被测试覆盖。
  若只需覆盖状态信号在各采样时刻的取值分布（不关心转移路径），请使用 cov_value_coverage_v1。
parameters:
  - name: group_name
    type: string
    required: true
    description: 覆盖率组名
    default: transition
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: signal
    type: string
    required: true
    description: 被覆盖信号名（通常为状态信号）
    role_hint: state
  - name: signal_width
    type: integer
    required: true
    description: 信号位宽
    default: "3"
  - name: state_list
    type: string
    required: true
    description: 合法状态值列表，逗号分隔，如 IDLE,ACTIVE,DONE
    default: "IDLE, ACTIVE, DONE"
maturity: production
related_ids:
  - cov_value_coverage_v1
template_body: |
  // Coverage: 状态转换覆盖率 — {{ group_name }}
  covergroup cg_{{ group_name }}_transition @(posedge {{ clk }});
    option.per_instance = 1;
    option.comment = "{{ group_name }} 状态转换覆盖率";

    cp_{{ signal }}: coverpoint {{ signal }} {
      bins states[] = {{ '{' }}{{ state_list }}{{ '}' }};
    }

    cp_{{ signal }}_trans: coverpoint {{ signal }} {
      bins trans[] = ({{ state_list }} => {{ state_list }});
    }

  endgroup

  cg_{{ group_name }}_transition cg_{{ group_name }}_transition_inst = new();
