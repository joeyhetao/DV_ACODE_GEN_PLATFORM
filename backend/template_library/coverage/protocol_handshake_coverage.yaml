id: cov_protocol_handshake_v1
version: "1.0.0"
name: 协议握手覆盖率组
code_type: coverage
subcategory: protocol_coverage
protocol:
  - AXI4
  - AXI4-Lite
  - AXI4-Stream
tags:
  - coverage
  - handshake
  - protocol
keywords:
  - 握手覆盖
  - valid
  - ready
  - 协议覆盖
  - AXI
  - AXI握手场景
  - 握手成功
  - valid等待
  - ready预备
  - 四种握手状态
  - 握手覆盖率
  - AXI4握手
description: |
  做什么：专用于 AXI4 / AXI4-Lite / AXI4-Stream Valid/Ready 握手协议，固定收集四种语义命名场景覆盖率——握手成功（valid=1,ready=1）、valid 等待（valid=1,ready=0）、ready 预备（valid=0,ready=1）、双方空闲（valid=0,ready=0）。
  典型场景：AXI 写地址通道 awvalid/awready 四态分布、AXI-Stream tvalid/tready 流控场景覆盖、确认接口在 ready 预备态的覆盖情况。
  边界：请勿用于"任意两个独立信号做值域交叉"（无协议语义，自由 bin）—— 那是 cov_cross_coverage_v1；也不要用于"valid 等待期间 data 必须稳定"（断言而非覆盖率）—— 那是 sva_handshake_stable_v1。
differentiators:
  - 固定四种握手场景（handshake_done / valid_wait / ready_preemptive / both_inactive），bins 由模板硬编码（vs cov_cross_coverage_v1 的自由 bins_a/bins_b）
  - 参数只需 valid / ready 信号名（vs cov_cross_coverage_v1 需要 signal_a/b + bins_a/b 四参数）
  - 输出 cross bin 自带 binsof 表达式，无需用户写 bin 切片逻辑
non_use_cases:
  - 对任意两个非协议信号做值域交叉覆盖（应用 cov_cross_coverage_v1）
  - 断言 valid 等待期间 data 必须稳定（应用 sva_handshake_stable_v1）
  - 断言 ready 必须在 N 周期内响应（应用 sva_handshake_timeout_v1）
parameters:
  - name: group_name
    type: string
    required: true
    description: 覆盖率组名
    # default 用 'protocol_handshake' 描述测量模式，而非 subcategory 的 'protocol_coverage'：
    # body 是 cg_{{ group_name }}_handshake，渲染成 cg_protocol_handshake_handshake，
    # 标识符可读且不与 subcategory 命名层级冲突。
    default: protocol_handshake
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: valid
    type: string
    required: true
    description: Valid信号名
    role_hint: valid
  - name: ready
    type: string
    required: true
    description: Ready信号名
    role_hint: ready
maturity: production
related_ids:
  - cov_value_coverage_v1
template_body: |
  // Coverage: 协议握手场景覆盖率 — {{ group_name }}
  covergroup cg_{{ group_name }}_handshake @(posedge {{ clk }});
    option.per_instance = 1;
    option.comment = "{{ group_name }} Valid/Ready握手场景覆盖率";

    // 握手状态交叉：覆盖4种组合
    cp_{{ valid }}: coverpoint {{ valid }} {
      bins active   = {1};
      bins inactive = {0};
    }

    cp_{{ ready }}: coverpoint {{ ready }} {
      bins active   = {1};
      bins inactive = {0};
    }

    cx_handshake: cross cp_{{ valid }}, cp_{{ ready }} {
      // valid=1, ready=1: 握手成功
      bins handshake_done    = binsof(cp_{{ valid }}.active)   && binsof(cp_{{ ready }}.active);
      // valid=1, ready=0: 等待响应
      bins valid_wait        = binsof(cp_{{ valid }}.active)   && binsof(cp_{{ ready }}.inactive);
      // valid=0, ready=1: ready预备
      bins ready_preemptive  = binsof(cp_{{ valid }}.inactive) && binsof(cp_{{ ready }}.active);
      // valid=0, ready=0: 双方空闲
      bins both_inactive     = binsof(cp_{{ valid }}.inactive) && binsof(cp_{{ ready }}.inactive);
    }

  endgroup

  cg_{{ group_name }}_handshake cg_{{ group_name }}_handshake_inst = new();
