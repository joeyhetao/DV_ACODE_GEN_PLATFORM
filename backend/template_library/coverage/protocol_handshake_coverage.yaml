id: cov_protocol_handshake_v1
version: "1.0.0"
name: 协议握手覆盖率组
code_type: coverage
subcategory: protocol_coverage
protocol:
  - AXI4
  - AXI4-Lite
  - AXI4-Stream
tags:
  - coverage
  - handshake
  - protocol
keywords:
  - 握手覆盖
  - valid
  - ready
  - 协议覆盖
  - AXI
  - AXI握手场景
  - 握手成功
  - valid等待
  - ready预备
  - 四种握手状态
  - 握手覆盖率
  - AXI4握手
description: |
  收集 AXI4/AXI4-Lite/AXI4-Stream Valid/Ready 握手协议的四种关键场景覆盖率：
  握手成功（valid=1,ready=1）、valid 等待（valid=1,ready=0）、ready 预备（valid=0,ready=1）、双方空闲（valid=0,ready=0）。
  本模板专用于 AXI 协议握手场景的专项覆盖；若需对任意两个独立信号做值域交叉覆盖，请使用 cov_cross_coverage_v1。
parameters:
  - name: group_name
    type: string
    required: true
    description: 覆盖率组名
    # default 用 'protocol_handshake' 描述测量模式，而非 subcategory 的 'protocol_coverage'：
    # body 是 cg_{{ group_name }}_handshake，渲染成 cg_protocol_handshake_handshake，
    # 标识符可读且不与 subcategory 命名层级冲突。
    default: protocol_handshake
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: valid
    type: string
    required: true
    description: Valid信号名
    role_hint: valid
  - name: ready
    type: string
    required: true
    description: Ready信号名
    role_hint: ready
maturity: production
related_ids:
  - cov_value_coverage_v1
template_body: |
  // Coverage: 协议握手场景覆盖率 — {{ group_name }}
  covergroup cg_{{ group_name }}_handshake @(posedge {{ clk }});
    option.per_instance = 1;
    option.comment = "{{ group_name }} Valid/Ready握手场景覆盖率";

    // 握手状态交叉：覆盖4种组合
    cp_{{ valid }}: coverpoint {{ valid }} {
      bins active   = {1};
      bins inactive = {0};
    }

    cp_{{ ready }}: coverpoint {{ ready }} {
      bins active   = {1};
      bins inactive = {0};
    }

    cx_handshake: cross cp_{{ valid }}, cp_{{ ready }} {
      // valid=1, ready=1: 握手成功
      bins handshake_done    = binsof(cp_{{ valid }}.active)   && binsof(cp_{{ ready }}.active);
      // valid=1, ready=0: 等待响应
      bins valid_wait        = binsof(cp_{{ valid }}.active)   && binsof(cp_{{ ready }}.inactive);
      // valid=0, ready=1: ready预备
      bins ready_preemptive  = binsof(cp_{{ valid }}.inactive) && binsof(cp_{{ ready }}.active);
      // valid=0, ready=0: 双方空闲
      bins both_inactive     = binsof(cp_{{ valid }}.inactive) && binsof(cp_{{ ready }}.inactive);
    }

  endgroup

  cg_{{ group_name }}_handshake cg_{{ group_name }}_handshake_inst = new();
