id: cov_value_coverage_v1
version: "1.0.0"
name: 信号值域覆盖率组
code_type: coverage
subcategory: value_coverage
protocol: []
tags:
  - coverage
  - value
  - bins
keywords:
  - 值覆盖
  - 枚举
  - bins
  - value_coverage
  - 取值分布
  - 值域统计
  - 点覆盖
  - 信号值域
  - 枚举值
  - 控制信号
  - 寄存器取值
description: |
  统计信号在各采样时刻的取值分布（点覆盖）：验证信号的每个合法取值或区间是否被触发过。
  本模板关注单一信号的值域覆盖，不涉及相邻时刻之间的状态转移路径。
  典型场景：error_code 的 0~15 每个值都必须被覆盖、status 寄存器所有枚举值覆盖率。
  若需覆盖 FSM 状态之间的转移路径（A→B 边覆盖），请使用 cov_transition_coverage_v1。
parameters:
  - name: group_name
    type: string
    required: true
    description: 覆盖率组名
    default: value
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: signal
    type: string
    required: true
    description: 被覆盖信号名
    role_hint: data
  - name: signal_width
    type: integer
    required: true
    description: 信号位宽
    default: "4"
  - name: bins_expr
    type: string
    required: true
    description: bins定义表达式，如 {0, 1, 2, 3} 或 {[0:15]}
    default: "{[0:15]}"
maturity: production
related_ids: []
template_body: |
  // Coverage: 信号值域覆盖率 — {{ group_name }}
  covergroup cg_{{ group_name }}_value @(posedge {{ clk }});
    option.per_instance = 1;
    option.comment = "{{ group_name }} 值域覆盖率";

    cp_{{ signal }}: coverpoint {{ signal }} {
      bins valid_values[] = {{ bins_expr }};
      bins others = default;
    }

  endgroup

  cg_{{ group_name }}_value cg_{{ group_name }}_value_inst = new();
