id: cov_value_coverage_v1
version: "1.0.0"
name: 信号值域覆盖率组
code_type: coverage
subcategory: value_coverage
protocol: []
tags:
  - coverage
  - value
  - bins
keywords:
  - 值覆盖
  - 枚举
  - bins
  - value_coverage
  - 取值分布
  - 值域统计
  - 点覆盖
  - 信号值域
  - 枚举值
  - 控制信号
  - 寄存器取值
description: |
  做什么：统计单一信号在各采样时刻的取值分布（点覆盖 coverpoint），验证每个合法取值或区间是否至少被触发过一次，bins 由 bins_expr 定义。
  典型场景：error_code 的 0~15 每个值都必须被覆盖、status 寄存器所有枚举值覆盖率、4 位 cmd 信号每个 opcode 被采样过。
  边界：请勿用于"FSM 状态 A → B 转移路径覆盖"（边覆盖，不是点覆盖）—— 那是 cov_transition_coverage_v1；也不要用于"两个独立信号的值组合覆盖"—— 那是 cov_cross_coverage_v1。
differentiators:
  - 单一 coverpoint 上的点覆盖（bins），不涉及 transitions 或 cross
  - 必填 bins_expr 参数（如 `{[0:15]}` / `{0, 1, 2, 3}`），其他 coverage 模板没有该参数
  - 信号位宽 signal_width 用于推导默认 bins 区间
non_use_cases:
  - 统计 FSM 状态之间的转移路径覆盖率（应用 cov_transition_coverage_v1）
  - 统计两个信号组合（AxB）的交叉覆盖率（应用 cov_cross_coverage_v1）
  - 统计 valid/ready 握手四种场景覆盖率（应用 cov_protocol_handshake_v1）
parameters:
  - name: group_name
    type: string
    required: true
    description: 覆盖率组名
    default: value
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: signal
    type: string
    required: true
    description: 被覆盖信号名
    role_hint: data
  - name: signal_width
    type: integer
    required: true
    description: 信号位宽
    default: "4"
  - name: bins_expr
    type: string
    required: true
    description: bins定义表达式，如 {0, 1, 2, 3} 或 {[0:15]}
    default: "{[0:15]}"
maturity: production
related_ids: []
template_body: |
  // Coverage: 信号值域覆盖率 — {{ group_name }}
  covergroup cg_{{ group_name }}_value @(posedge {{ clk }});
    option.per_instance = 1;
    option.comment = "{{ group_name }} 值域覆盖率";

    cp_{{ signal }}: coverpoint {{ signal }} {
      bins valid_values[] = {{ bins_expr }};
      bins others = default;
    }

  endgroup

  cg_{{ group_name }}_value cg_{{ group_name }}_value_inst = new();
