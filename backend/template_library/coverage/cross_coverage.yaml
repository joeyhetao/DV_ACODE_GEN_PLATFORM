id: cov_cross_coverage_v1
version: "1.0.0"
name: 交叉覆盖率组
code_type: coverage
subcategory: cross_coverage
protocol: []
tags:
  - coverage
  - cross
  - corner_case
keywords:
  - 交叉覆盖
  - cross
  - 组合覆盖
  - corner_case
description: |
  做什么：对任意两个独立信号 signal_a / signal_b 各建一个 coverpoint，并用 `cross cp_a, cp_b` 收集组合覆盖率，发现信号对的未覆盖 corner case 组合。
  典型场景：cmd_type × data_size 组合是否全覆盖、mode × priority 组合矩阵、enable × addr_range 边界条件交叉。
  边界：请勿用于"AXI valid/ready 握手四种场景"（语义命名 bin 而非自由信号交叉）—— 那是 cov_protocol_handshake_v1；也不要用于"FSM 状态间转移路径"—— 那是 cov_transition_coverage_v1。
differentiators:
  - 通用两信号交叉，参数命名是 signal_a / signal_b（vs cov_protocol_handshake_v1 的 valid / ready 协议角色名）
  - 必填 bins_a 和 bins_b 两组独立 bins_expr（其他 coverage 模板没有 bins_a/b 双参数）
  - 不内置场景命名（如握手成功 / valid 等待），让用户完全自定义 bin
non_use_cases:
  - 收集 AXI valid/ready 握手四种场景覆盖率（应用 cov_protocol_handshake_v1，含语义命名 bin）
  - 统计单个信号的取值分布（应用 cov_value_coverage_v1）
  - 统计 FSM 状态之间的转移路径（应用 cov_transition_coverage_v1）
parameters:
  - name: group_name
    type: string
    required: true
    description: 覆盖率组名
    default: cross
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: signal_a
    type: string
    required: true
    description: 第一个信号名
    role_hint: data
  - name: signal_b
    type: string
    required: true
    description: 第二个信号名
    role_hint: control
  - name: bins_a
    type: string
    required: true
    description: 信号A的bins定义
    default: "{[0:3]}"
  - name: bins_b
    type: string
    required: true
    description: 信号B的bins定义
    default: "{0, 1}"
maturity: production
related_ids:
  - cov_value_coverage_v1
template_body: |
  // Coverage: 交叉覆盖率 — {{ group_name }}
  covergroup cg_{{ group_name }}_cross @(posedge {{ clk }});
    option.per_instance = 1;
    option.comment = "{{ group_name }} 交叉覆盖率";

    cp_{{ signal_a }}: coverpoint {{ signal_a }} {
      bins a_vals[] = {{ bins_a }};
    }

    cp_{{ signal_b }}: coverpoint {{ signal_b }} {
      bins b_vals[] = {{ bins_b }};
    }

    cx_{{ signal_a }}_x_{{ signal_b }}: cross cp_{{ signal_a }}, cp_{{ signal_b }};

  endgroup

  cg_{{ group_name }}_cross cg_{{ group_name }}_cross_inst = new();
