id: sva_fsm_state_transition_v1
version: "1.0.0"
name: FSM状态转换合法性断言
code_type: assertion
subcategory: fsm
protocol: []
tags:
  - fsm
  - state_machine
  - transition
keywords:
  - FSM
  - 状态机
  - 状态转换
  - state
  - transition
  - 条件跳转
  - 触发条件
  - 合法跳转
  - 非法状态
  - 状态跳转
  - 禁止跳转
  - 跳转到
  - condition
  - 当信号满足时
  - 跳转合法性
description: |
  在特定业务条件（非复位）满足时，FSM 必须从指定状态跳转到目标状态，防止非法状态转换。
  触发条件是业务逻辑信号（如 valid、enable、last_beat），而非复位信号。
  典型场景：IDLE 且 valid=1 时必须跳到 ACTIVE、BUSY 不能直接跳到 IDLE 必须经过 DRAIN。
  若验证的是"复位释放后状态必须回到初始值"（rst_n 触发），请使用 sva_reset_behavior_v1。
parameters:
  - name: module_name
    type: string
    expr_type: sv_identifier
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    expr_type: sv_identifier
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    expr_type: sv_identifier
    required: true
    description: 复位信号
    default: rst_n
  - name: state_sig
    type: string
    expr_type: sv_identifier
    required: true
    description: 状态信号名
    role_hint: state
  - name: from_state
    type: string
    expr_type: sv_identifier
    required: true
    description: 初始状态枚举值
    default: IDLE
  - name: condition
    type: string
    expr_type: sv_boolean_expr
    required: true
    description: 触发转换的条件表达式
  - name: to_state
    type: string
    expr_type: sv_identifier
    required: true
    description: 目标状态枚举值
    default: ACTIVE
maturity: production
related_ids: []
template_body: |
  // SVA: FSM状态转换合法性 — {{ module_name }}
  module {{ module_name }}_fsm_transition_sva (
      input logic        {{ clk }},
      input logic        {{ rst_n }},
      input logic [3:0]  {{ state_sig }},
      input logic        {{ condition }}
  );

    // 当FSM在from_state且条件满足时，下一拍必须转换到to_state
    property p_fsm_{{ from_state }}_to_{{ to_state }};
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      ({{ state_sig }} == {{ from_state }} && {{ condition }}) |=> ({{ state_sig }} == {{ to_state }});
    endproperty

    a_fsm_{{ from_state }}_to_{{ to_state }}: assert property (p_fsm_{{ from_state }}_to_{{ to_state }})
      else $error("[SVA FAIL] %m: FSM 未从 {{ from_state }} 转换到 {{ to_state }} @ %0t", $time);

    c_fsm_transition: cover property (
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      ({{ state_sig }} == {{ from_state }}) ##1 ({{ state_sig }} == {{ to_state }})
    );

  endmodule
