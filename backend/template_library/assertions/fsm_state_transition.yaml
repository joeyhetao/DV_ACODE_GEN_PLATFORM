id: sva_fsm_state_transition_v1
version: "1.0.0"
name: FSM状态转换合法性断言
code_type: assertion
subcategory: fsm
protocol: []
tags:
  - fsm
  - state_machine
  - transition
keywords:
  - FSM
  - 状态机
  - 状态转换
  - state
  - transition
  - 条件跳转
  - 触发条件
  - 合法跳转
  - 非法状态
  - 状态跳转
  - 禁止跳转
  - 跳转到
  - condition
  - 当信号满足时
  - 跳转合法性
description: |
  做什么：在特定业务条件（condition）满足时，断言 FSM 必须从 from_state 跳转到 to_state，防止非法状态转换或漏转换。触发条件是业务信号（valid / enable / last_beat 等），不是复位边沿。
  典型场景：IDLE 且 valid=1 时下一拍必须跳到 ACTIVE；ACTIVE 在 last_beat 置高时必须跳到 DONE；BUSY 不能直接跳到 IDLE 必须经过 DRAIN。
  边界：请勿用于"复位释放后状态必须回到初始值"（rst_n $rose 触发，无业务 condition）—— 那是 sva_reset_behavior_v1；也不要用于"状态转换路径覆盖率统计"（不是断言）—— 那是 cov_transition_coverage_v1。
differentiators:
  - 触发条件是业务信号 condition 表达式（vs sva_reset_behavior_v1 的 rst_n 边沿）
  - 显式 from_state / to_state 双状态参数，断言"必须跳"的强约束（vs 覆盖率"曾经发生过"的弱观察）
  - 必填 condition 参数（sv_boolean_expr 类型）；sva_reset_behavior_v1 无此参数
non_use_cases:
  - 验证复位释放后 FSM 回到 IDLE / INIT 初始状态（应用 sva_reset_behavior_v1）
  - 统计 FSM 状态转换路径覆盖率（应用 cov_transition_coverage_v1）
  - 验证 valid/ready 协议握手或数据稳定性
parameters:
  - name: module_name
    type: string
    expr_type: sv_identifier
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    expr_type: sv_identifier
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    expr_type: sv_identifier
    required: true
    description: 复位信号
    default: rst_n
  - name: state_sig
    type: string
    expr_type: sv_identifier
    required: true
    description: 状态信号名
    role_hint: state
  - name: from_state
    type: string
    expr_type: sv_identifier
    required: true
    description: 初始状态枚举值
    default: IDLE
  - name: condition
    type: string
    expr_type: sv_boolean_expr
    required: true
    description: 触发转换的条件表达式
  - name: to_state
    type: string
    expr_type: sv_identifier
    required: true
    description: 目标状态枚举值
    default: ACTIVE
maturity: production
related_ids: []
template_body: |
  // SVA: FSM状态转换合法性 — {{ module_name }}
  module {{ module_name }}_fsm_transition_sva (
      input logic        {{ clk }},
      input logic        {{ rst_n }},
      input logic [3:0]  {{ state_sig }},
      input logic        {{ condition }}
  );

    // 当FSM在from_state且条件满足时，下一拍必须转换到to_state
    property p_fsm_{{ from_state }}_to_{{ to_state }};
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      ({{ state_sig }} == {{ from_state }} && {{ condition }}) |=> ({{ state_sig }} == {{ to_state }});
    endproperty

    a_fsm_{{ from_state }}_to_{{ to_state }}: assert property (p_fsm_{{ from_state }}_to_{{ to_state }})
      else $error("[SVA FAIL] %m: FSM 未从 {{ from_state }} 转换到 {{ to_state }} @ %0t", $time);

    c_fsm_transition: cover property (
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      ({{ state_sig }} == {{ from_state }}) ##1 ({{ state_sig }} == {{ to_state }})
    );

  endmodule
