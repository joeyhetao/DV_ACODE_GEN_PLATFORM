id: sva_data_integrity_v1
version: "1.0.0"
name: 数据完整性无损坏断言
code_type: assertion
subcategory: data_integrity
protocol: []
tags:
  - data_integrity
  - stability
  - protection
keywords:
  - 数据完整性
  - 稳定
  - 保护
  - integrity
  - stable
description: |
  做什么：当使能信号 enable 拉低（无效）时，断言被保护的数据信号 data 必须 $stable（不发生变化），用于"无授权不写入"约束的形式化验证。
  典型场景：寄存器写保护场景 wr_en=0 时 reg_data 不能变；data 锁存器在 lat_en 无效时输出保持；shadow register 在 update_en=0 期间值不更新。
  边界：请勿用于"valid/ready 握手等待期间 data $stable"（语义不同：握手等待 vs 写使能保护）—— 那是 sva_handshake_stable_v1；也不要用于"复位释放后数据归零"—— 那是 sva_reset_behavior_v1。
differentiators:
  - 触发条件是 `!enable`（写使能无效态），非握手等待态 `valid && !ready`
  - 必填 enable 参数（高有效写使能），sva_handshake_stable_v1 用 valid/ready
  - 不关心数据值是否归零或匹配某常量，只关心"无授权时不能变"
non_use_cases:
  - 验证 AXI valid/ready 握手等待期间 data 稳定（应用 sva_handshake_stable_v1）
  - 验证复位释放后 data 等于初始值（应用 sva_reset_behavior_v1）
  - 验证两信号互斥（如 cpu_req / dma_req 不能同时为 1）—— 库内暂无该类模板，应建议贡献
parameters:
  - name: module_name
    type: string
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: enable
    type: string
    required: true
    description: 写使能信号名（高有效）
    role_hint: enable
  - name: data
    type: string
    required: true
    description: 被保护的数据信号名
    role_hint: data
maturity: production
related_ids: []
template_body: |
  // SVA: 数据完整性保护 — {{ module_name }}
  module {{ module_name }}_data_integrity_sva (
      input logic        {{ clk }},
      input logic        {{ rst_n }},
      input logic        {{ enable }},
      input logic [31:0] {{ data }}
  );

    // 使能无效时数据不允许改变
    property p_data_no_change_without_enable;
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      !{{ enable }} |-> $stable({{ data }});
    endproperty

    a_data_integrity: assert property (p_data_no_change_without_enable)
      else $error("[SVA FAIL] %m: {{ data }} 在 {{ enable }} 无效时发生变化 @ %0t", $time);

    c_data_write_enabled: cover property (
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      {{ enable }} ##1 !{{ enable }}
    );

  endmodule
