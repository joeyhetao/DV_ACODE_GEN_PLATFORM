id: sva_handshake_stable_v1
version: "1.0.0"
name: AXI Valid-Ready握手数据稳定性断言
code_type: assertion
subcategory: handshake
protocol:
  - AXI4
  - AXI4-Lite
  - AXI4-Stream
tags:
  - handshake
  - stability
  - valid_ready
keywords:
  - valid
  - ready
  - stable
  - 握手
  - 数据稳定
  - 保持不变
  - 数据保护
  - payload
  - 总线数据
  - 不能变化
  - wdata
  - rdata
  - 稳定性
  - 数据完整性
  - 握手等待
description: |
  做什么：当 valid 拉高且 ready 尚未响应（握手等待期间），断言数据/payload 信号必须保持稳定（$stable），关注的是"等待期间数据不变"。
  典型场景：wvalid=1 但 wready=0 期间 wdata 不能改变；arvalid 期间 araddr 必须保持稳定；axis tvalid 拉高等待 tready 时 tdata 不允许更新。
  边界：请勿用于"ready 必须在 N 周期内响应"（超时检测）—— 那是 sva_handshake_timeout_v1；也不要用于"req → ack 响应时间上限"（通用两事件时序）—— 那是 sva_timing_max_delay_v1。
differentiators:
  - 关注的是 valid 等待期间 data/payload 的 $stable 稳定性，不数等待周期、不抛超时
  - 触发条件是 `valid && !ready`（握手未完成态），不关心首次 valid 上升沿后等多久 ready 才到
  - 必填参数包含 data（被保护的数据信号），sva_handshake_timeout_v1 没有 data
non_use_cases:
  - 验证 ready 必须在 N 周期内响应（应用 sva_handshake_timeout_v1）
  - 验证通用 req → ack 时序延迟上限（应用 sva_timing_max_delay_v1）
  - 验证 FSM 状态转换或复位行为
parameters:
  - name: module_name
    type: string
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号（低有效）
    default: rst_n
  - name: valid
    type: string
    required: true
    description: Valid信号名
    role_hint: valid
  - name: ready
    type: string
    required: true
    description: Ready信号名
    role_hint: ready
  - name: data
    type: string
    required: true
    description: 需保持稳定的数据信号
    role_hint: data
maturity: production
related_ids: []
template_body: |
  // SVA: Valid-Ready握手数据稳定性 — {{ module_name }}
  module {{ module_name }}_handshake_stable_sva (
      input logic        {{ clk }},
      input logic        {{ rst_n }},
      input logic        {{ valid }},
      input logic        {{ ready }},
      input logic [31:0] {{ data }}
  );

    // 当valid有效且ready未响应时，data必须保持稳定
    property p_data_stable_when_valid;
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      ({{ valid }} && !{{ ready }}) |-> ##1 $stable({{ data }});
    endproperty

    a_data_stable_when_valid: assert property (p_data_stable_when_valid)
      else $error("[SVA FAIL] %m: {{ data }} 在握手期间发生变化 @ %0t", $time);

    c_data_stable_when_valid: cover property (
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      ({{ valid }} && !{{ ready }}) ##1 ({{ valid }} && {{ ready }})
    );

  endmodule
