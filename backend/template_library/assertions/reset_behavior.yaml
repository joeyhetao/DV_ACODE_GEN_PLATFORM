id: sva_reset_behavior_v1
version: "1.0.0"
name: 复位释放后初始值断言
code_type: assertion
subcategory: reset
protocol: []
tags:
  - reset
  - initialization
  - power_on
  - fsm_reset
  - state_initialization
keywords:
  - 复位
  - reset
  - 初始值
  - initialization
  - 初始状态
  - 状态寄存器
  - FSM复位
  - rst_n释放
  - 复位后初始值
  - 上电初始化
  - 寄存器清零
  - 复位释放
description: |
  做什么：验证复位（rst_n）释放后，目标信号在 settle_cycles 周期内必须等于 init_value；同时断言复位有效期间 target 必须保持 init_value。触发是 $rose(rst_n) 边沿，不带业务 condition。
  典型场景：cur_state 在 rst_n 释放后必须等于 IDLE；data_out 寄存器复位后归零；counter 上电复位后必须为 0；状态机复位后回到 INIT 而非任意值。
  边界：请勿用于"在某业务条件满足时 FSM 从 A 跳到 B"（非复位触发，需要 condition 参数）—— 那是 sva_fsm_state_transition_v1；也不要用于"使能无效时数据不变"—— 那是 sva_data_integrity_v1。
differentiators:
  - 触发条件是 $rose(rst_n)（复位事件），不带业务 condition 参数（vs sva_fsm_state_transition_v1）
  - 必填 init_value 参数（复位后期望值，可以是 0 / IDLE / INIT）；sva_fsm_state_transition_v1 用 to_state
  - 同时检查复位期间 target == init_value 和复位释放后 target 重新等于 init_value 两条断言
non_use_cases:
  - 验证业务条件触发的 FSM 状态跳转（应用 sva_fsm_state_transition_v1）
  - 验证使能无效时数据保持不变（应用 sva_data_integrity_v1）
  - 验证 valid/ready 协议握手或时序延迟
parameters:
  - name: module_name
    type: string
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号（低有效）
    default: rst_n
  - name: target
    type: string
    required: true
    description: 目标信号名（数据信号或状态寄存器，如 cur_state、data_out）
    role_hint: data
  - name: init_value
    type: string
    required: true
    description: 复位后期望的初始值（数值或枚举值，如 0、IDLE、INIT）
    default: "0"
  - name: settle_cycles
    type: integer
    required: false
    description: 复位释放后允许的稳定周期数
    default: "1"
maturity: production
related_ids: []
template_body: |
  // SVA: 复位释放后初始值验证 — {{ module_name }}
  module {{ module_name }}_reset_behavior_sva (
      input logic        {{ clk }},
      input logic        {{ rst_n }},
      input logic [31:0] {{ target }}
  );

    // 复位期间target必须为init_value
    property p_reset_value;
      @(posedge {{ clk }})
      !{{ rst_n }} |-> ({{ target }} == {{ init_value }});
    endproperty

    // 复位释放后settle_cycles内target达到init_value
    property p_reset_release;
      @(posedge {{ clk }})
      $rose({{ rst_n }}) |-> ##[0:{{ settle_cycles }}] ({{ target }} == {{ init_value }});
    endproperty

    a_reset_value: assert property (p_reset_value)
      else $error("[SVA FAIL] %m: 复位期间 {{ target }} != {{ init_value }} @ %0t", $time);

    a_reset_release: assert property (p_reset_release)
      else $error("[SVA FAIL] %m: 复位释放后 {{ settle_cycles }} 周期内 {{ target }} 未达到 {{ init_value }} @ %0t", $time);

  endmodule
