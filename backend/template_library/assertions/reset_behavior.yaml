id: sva_reset_behavior_v1
version: "1.0.0"
name: 复位释放后初始值断言
code_type: assertion
subcategory: reset
protocol: []
tags:
  - reset
  - initialization
  - power_on
  - fsm_reset
  - state_initialization
keywords:
  - 复位
  - reset
  - 初始值
  - initialization
  - 初始状态
  - 状态寄存器
  - FSM复位
  - rst_n释放
  - 复位后初始值
  - 上电初始化
  - 寄存器清零
  - 复位释放
description: |
  验证复位信号（rst_n）释放后，目标信号必须在指定周期内达到初始值，确保正确的复位行为。
  触发条件是 rst_n 边沿（复位事件），而非业务逻辑条件。
  适用于：数据寄存器/计数器复位归零、FSM 状态机复位后必须回到初始状态（如 cur_state 复位释放后必须等于 IDLE）。
  若验证的是"在某业务条件满足时 FSM 从 A 状态跳转到 B 状态"（非复位触发），请使用 sva_fsm_state_transition_v1。
parameters:
  - name: module_name
    type: string
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号（低有效）
    default: rst_n
  - name: target
    type: string
    required: true
    description: 目标信号名（数据信号或状态寄存器，如 cur_state、data_out）
    role_hint: data
  - name: init_value
    type: string
    required: true
    description: 复位后期望的初始值（数值或枚举值，如 0、IDLE、INIT）
    default: "0"
  - name: settle_cycles
    type: integer
    required: false
    description: 复位释放后允许的稳定周期数
    default: "1"
maturity: production
related_ids: []
template_body: |
  // SVA: 复位释放后初始值验证 — {{ module_name }}
  module {{ module_name }}_reset_behavior_sva (
      input logic        {{ clk }},
      input logic        {{ rst_n }},
      input logic [31:0] {{ target }}
  );

    // 复位期间target必须为init_value
    property p_reset_value;
      @(posedge {{ clk }})
      !{{ rst_n }} |-> ({{ target }} == {{ init_value }});
    endproperty

    // 复位释放后settle_cycles内target达到init_value
    property p_reset_release;
      @(posedge {{ clk }})
      $rose({{ rst_n }}) |-> ##[0:{{ settle_cycles }}] ({{ target }} == {{ init_value }});
    endproperty

    a_reset_value: assert property (p_reset_value)
      else $error("[SVA FAIL] %m: 复位期间 {{ target }} != {{ init_value }} @ %0t", $time);

    a_reset_release: assert property (p_reset_release)
      else $error("[SVA FAIL] %m: 复位释放后 {{ settle_cycles }} 周期内 {{ target }} 未达到 {{ init_value }} @ %0t", $time);

  endmodule
