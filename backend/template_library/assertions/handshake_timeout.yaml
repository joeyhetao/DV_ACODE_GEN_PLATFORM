id: sva_handshake_timeout_v1
version: "1.0.0"
name: Valid-Ready握手超时检测断言
code_type: assertion
subcategory: handshake
protocol:
  - AXI4
  - AXI4-Lite
  - AXI4-Stream
tags:
  - handshake
  - timeout
  - valid_ready
keywords:
  - valid
  - ready
  - timeout
  - 握手
  - 超时
  - AXI
  - AXI4
  - valid_ready
  - 死锁
  - 协议
description: |
  做什么：专用于 AXI4 / AXI4-Lite / AXI4-Stream Valid/Ready 握手协议的超时检测——valid 持续拉高直到 ready 响应，断言 ready 必须在指定 max_cycles 周期内到来。
  典型场景：AXI awvalid → awready 在 16 周期内完成、axis tvalid 拉高后 tready 不超过 N 周期、AXI-Lite 写地址通道防死锁约束。
  边界：请勿用于"valid 等待期间 data 必须 $stable"（数据稳定性）—— 那是 sva_handshake_stable_v1；也不要用于"通用 req → ack 两事件时序上限"（非协议握手）—— 那是 sva_timing_max_delay_v1。
differentiators:
  - 专为 AXI valid/ready 协议设计：valid 持续拉高直到 ready 响应（vs sva_timing_max_delay_v1 的两个独立 $rose 事件）
  - 关注的是等待周期数 / 超时门限，不检测数据稳定性（vs sva_handshake_stable_v1 的 $stable）
  - 必填 max_cycles 参数，sva_handshake_stable_v1 没有
non_use_cases:
  - 验证 valid 等待期间 data 不变（应用 sva_handshake_stable_v1）
  - 验证非协议握手的两事件时序延迟（应用 sva_timing_max_delay_v1）
  - 验证 FSM 状态转换或复位行为
parameters:
  - name: module_name
    type: string
    required: true
    description: 模块名
    default: dut
  - name: clk
    type: string
    required: true
    description: 时钟信号
    default: clk
  - name: rst_n
    type: string
    required: true
    description: 复位信号
    default: rst_n
  - name: valid
    type: string
    required: true
    description: Valid信号名
    role_hint: valid
  - name: ready
    type: string
    required: true
    description: Ready信号名
    role_hint: ready
  - name: max_cycles
    type: integer
    required: true
    description: 最大等待周期数
    default: "16"
maturity: production
related_ids:
  - sva_handshake_stable_v1
template_body: |
  // SVA: Valid-Ready握手超时检测 — {{ module_name }}
  module {{ module_name }}_handshake_timeout_sva (
      input logic {{ clk }},
      input logic {{ rst_n }},
      input logic {{ valid }},
      input logic {{ ready }}
  );

    // valid拉高后max_cycles个周期内ready必须响应
    property p_handshake_no_timeout;
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      $rose({{ valid }}) |-> ##[1:{{ max_cycles }}] {{ ready }};
    endproperty

    a_handshake_no_timeout: assert property (p_handshake_no_timeout)
      else $error("[SVA FAIL] %m: 握手超时 — {{ valid }} 拉高后 {{ max_cycles }} 周期内 {{ ready }} 未响应 @ %0t", $time);

    c_handshake_fast_ack: cover property (
      @(posedge {{ clk }}) disable iff (!{{ rst_n }})
      $rose({{ valid }}) ##1 {{ ready }}
    );

  endmodule
